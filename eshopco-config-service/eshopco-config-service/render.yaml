services:
  - type: web
    name: eshopco-effective-config
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_PORT
        value: "8288"
      - key: APP_LOG_LEVEL
        value: info
      - key: APP_ENV
        value: development
